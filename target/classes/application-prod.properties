# ==========================================
# GOMEZ SYSTEMS - CONFIGURACION PRODUCCION
# ==========================================
server.port=${PORT:8085}
spring.thymeleaf.cache=false

# --- BASE DE DATOS Y JPA ---
spring.datasource.url=${DB_URL:jdbc:h2:file:./basedatos/gymdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola Web H2 (si se requiere)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- EVOLUTION API (MOTOR G.O.M.E.Z. WHATSAPP) ---
